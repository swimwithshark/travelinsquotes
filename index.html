    function calculatePremiumForCompany(companyData, regionCode, days) {
        const regionData = companyData.regions[regionCode];
        if (!regionData) return { adult: 0, senior: 0, child: 0 };

        let rateObj = null;

        for (let band of regionData.bands) {
            if (days <= band.max) {
                rateObj = band;
                break;
            }
        }

        let adultBase = 0, seniorBase = 0;

        if (rateObj) {
            adultBase = rateObj.adult;
            seniorBase = rateObj.senior;
        } else {
            // Exceeds max band: Base (last band) + Additional Weeks
            const baseBand = regionData.bands[regionData.bands.length - 1];
            const extraDays = days - baseBand.max;
            const extraWeeks = Math.ceil(extraDays / 7);

            adultBase = baseBand.adult + (extraWeeks * regionData.addWk.adult);
            seniorBase = baseBand.senior + (extraWeeks * regionData.addWk.senior);
        }

        // Children default to Adult rate for MSIG & Lonpac base calculations (Group Multipliers applied later)
        return { adult: adultBase, senior: seniorBase, child: adultBase };
    }

    function renderComparison() {
        const paxAdult = parseInt(document.getElementById('pax-adult').value) || 0;
        const paxSenior = parseInt(document.getElementById('pax-senior').value) || 0;
        const paxChild = parseInt(document.getElementById('pax-child').value) || 0;
        const totalPax = paxAdult + paxSenior + paxChild;
        
        const days = parseInt(document.getElementById('days').value) || 1;
        const country = document.getElementById('country').value.trim();
        const tier = document.getElementById('tier').value;
        const grid = document.getElementById('comparison-grid');
        
        if (totalPax === 0) {
            grid.innerHTML = '<div class="error-msg">Please enter at least 1 traveller.</div>';
            return;
        }
        if (days <= 0) {
            grid.innerHTML = '<div class="error-msg">Trip duration must be at least 1 day.</div>';
            return;
        }

        let regionMapping = defaultRegionMap;
        for (let key in countryMap) {
            if (country.toLowerCase().includes(key.toLowerCase())) {
                regionMapping = countryMap[key];
                break;
            }
        }

        grid.innerHTML = '';
        const currentData = insuranceData[tier];
        const companies = ['lonpac', 'allianz', 'msig'];

        companies.forEach(company => {
            const data = currentData[company];
            const regionCode = regionMapping[company];
            const rates = calculatePremiumForCompany(data, regionCode, days);
            
            let adultTotal = paxAdult * rates.adult;
            let seniorTotal = paxSenior * rates.senior;
            let childTotal = paxChild * rates.child;
            let discountNote = "";

            // Apply Special Allianz Multipliers
            if (company === 'allianz') {
                const groupMultiplier = totalPax >= 5 ? 0.95 : 1;
                adultTotal = adultTotal * groupMultiplier;
                seniorTotal = seniorTotal * groupMultiplier;
                childTotal = childTotal * groupMultiplier * 0.8; // Kids get 20% off
                if(totalPax >= 5) discountNote = "Includes 5% Group & 20% Child Discount";
                else if (paxChild > 0) discountNote = "Includes 20% Child Discount";
            }

            const totalPremium = adultTotal + seniorTotal + childTotal;
            const regionDisplay = regionCode === 'ww' || regionCode === 'area3' ? "Worldwide" : (regionCode === 'area2' && company === 'msig') ? "Europe/Area 2" : "Asia";
            
            const cardHTML = `
                <div class="card">
                    <div class="card-header">
                        <h3>
                            ${data.name}
                            <span class="tooltip">i
                                <span class="tooltiptext">${data.tooltip}</span>
                            </span>
                        </h3>
                        <p>Plan: ${data.plan} <br><small>(${regionDisplay} | ${days} Days)</small></p>
                    </div>
                    <div class="card-body">
                        <div class="premium-display">RM ${totalPremium.toFixed(2)}</div>
                        <div class="group-breakdown">
                            ${paxAdult} Adult(s), ${paxSenior} Senior(s), ${paxChild} Child(ren)
                            ${discountNote ? '<br><span style="color:var(--accent)">' + discountNote + '</span>' : ''}
                        </div>
                        
                        <div class="benefit-row">
                            <span class="benefit-label">Medical Expenses</span>
                            <span class="benefit-value">${data.medical}</span>
                        </div>
                        <div class="benefit-row">
                            <span class="benefit-label">Accidental Death</span>
                            <span class="benefit-value">${data.death}</span>
                        </div>
                        <div class="benefit-row">
                            <span class="benefit-label">Trip Cancellation</span>
                            <span class="benefit-value">${data.cancellation}</span>
                        </div>
                        <div class="benefit-row">
                            <span class="benefit-label">Baggage Delay</span>
                            <span class="benefit-value">${data.baggageDelay}</span>
                        </div>
                    </div>
                </div>
            `;
            grid.innerHTML += cardHTML;
        });
    }

    // Initialize the view
    renderComparison();
</script>

</body>
</html>
